[package]
name = "gitter"
version = "0.1.0"
edition = "2021"
description = "A fast, native, cross-platform Git client built with GPUI"
build = "build.rs"

[dependencies]
gpui = "0.2.2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
chrono = "0.4"
notify = "6"
smol = "2"
unicode-segmentation = "1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 4

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3.0"
